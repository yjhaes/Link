# 复制为 config/application-local.yml，填写实际值，在 IDEA 中启用 local profile。
# 真实文件被 Git 忽略，位于 src/main/resources 之外；详见 docs/入门与使用/local-secrets.md。
spring:
  datasource:
    url: 'jdbc:mysql://localhost:3306/short_link?serverTimezone=UTC'
    username: short_link
    password: '<your-project-mysql-password>'
  data:
    redis:
      host: localhost
      port: 6379
      # 本机 Redis 有认证时，在此补充 password；使用 ACL 用户时再补充 username。

short-link:
  base-url: 'http://localhost:8080'
  # 按本机配置指南分别生成两个独立 Base64 值，替换下面的令牌和访客密钥。
  internal-token: '<generated-management-token>'
  stats:
    enabled: true
    visitor-key: '<generated-base64-hmac-key>'
    visitor-key-version: 1
    rabbit:
      host: localhost
      port: 5672
      username: short_link
      password: '<your-project-rabbitmq-password>'
      virtual-host: short_link
      consumer-enabled: true
