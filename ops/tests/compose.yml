services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: short_link_test
      MYSQL_USER: linktest
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    ports: ["127.0.0.1::3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u linktest -D short_link_test -e 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 90
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 60
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: linktest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports: ["127.0.0.1::5672", "127.0.0.1::15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 3s
      timeout: 5s
      retries: 60
