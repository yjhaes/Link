spring:
  lifecycle:
    timeout-per-shutdown-phase: 2s
  application:
    name: short-link
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/short_link?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 200ms
      timeout: 200ms
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

short-link:
  rate-limit:
    create-capacity: ${SHORT_LINK_CREATE_RATE_CAPACITY:3}
    create-refill-interval: ${SHORT_LINK_CREATE_RATE_REFILL_INTERVAL:6s}
  stats:
    enabled: ${SHORT_LINK_STATS_ENABLED:true}
    rabbit:
      consumer-enabled: ${SHORT_LINK_STATS_CONSUMER_ENABLED:true}
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_PORT:5672}
      username: ${RABBITMQ_USERNAME:guest}
      password: ${RABBITMQ_PASSWORD:guest}
      virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    visitor-key: ${SHORT_LINK_VISITOR_HMAC_KEY:kPUaP271mwyCNIxFd210L1ZTWvFu9ZIemflWX73qiAE=}
    visitor-key-version: ${SHORT_LINK_VISITOR_KEY_VERSION:1}
  internal-token: ${SHORT_LINK_INTERNAL_TOKEN:kPUaP271mwyCNIxFd210L1ZTWvFu9ZIemflWX73qiAE=}
  base-url: ${SHORT_LINK_BASE_URL:http://localhost:8080}
  redirect-cache:
    enabled: ${SHORT_LINK_REDIRECT_CACHE_ENABLED:true}
    ttl: ${SHORT_LINK_REDIRECT_CACHE_TTL:5m}
    not-found-ttl: ${SHORT_LINK_NOT_FOUND_CACHE_TTL:30s}
    expired-ttl: ${SHORT_LINK_EXPIRED_CACHE_TTL:5m}
    disabled-ttl: ${SHORT_LINK_DISABLED_CACHE_TTL:15s}
    load-wait: ${SHORT_LINK_REDIRECT_LOAD_WAIT:200ms}
